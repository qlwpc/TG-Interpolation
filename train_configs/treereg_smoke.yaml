run_name: OLMo-300M-treereg-smoke
seed: 6198
dry_run: false
epoch: null

wandb:
  name: ${run_name}
  project: TG-bbcnews
  entity: qlwpc-shanghaitech-university

model:
  d_model: 768
  n_heads: 12
  n_layers: 12
  mlp_ratio: 4
  mlp_hidden_size: 3072
  weight_tying: true
  alibi: false
  rope: true
  flash_attention: true
  flex_attention: false
  attention_dropout: 0.0
  attention_layer_norm: false
  clip_qkv: null
  include_bias: true
  block_type: sequential
  layer_norm_type: rms
  layer_norm_with_affine: true
  layer_norm_eps: 1e-6
  bias_for_layer_norm: true
  attention_layer_norm_with_affine: false
  activation_type: swiglu
  residual_dropout: 0.0
  embedding_dropout: 0.0
  max_sequence_length: 2048
  vocab_size: 50320
  embedding_size: 50320
  eos_token_id: 50256
  pad_token_id: 50258
  init_device: cuda
  init_fn: normal
  init_std: 0.02
  init_cutoff_factor: 3
  transformer_grammar_type: treereg
  treereg_layer: 6          # middle layer (paper heuristic)
  treereg_n_heads: 3        # ~25% of 12 heads
  treereg_every_k: 10       # apply L_TR every 10 LM steps
  treereg_alpha: 1.0        # L_LM + alpha * L_TR
  parse_binarize_direction: left

ddp:
  grad_sync_mode: batch
  find_unused_params: false

# compile: REMOVED — `cfg.compile is not None` always compiles (even mode=null);
# torch.compile graph-breaks on index_put_ in compute_depth_matrix_gpu. Leave
# compile unset (= None) to skip torch.compile.

optimizer:
  name: adamw
  learning_rate: 0.002917
  weight_decay: 0.1
  eps: 1e-8
  betas:
  - 0.9
  - 0.95
  metrics_log_interval: 10

scheduler:
  name: cosine_with_warmup
  t_warmup: 0
  min_lr: 1e-5
  warmup_min_lr: 0

tokenizer:
  identifier: ${workspace}/dataset/bbc-news/TG_GPT2_tokenizer.json
  vocabulary: ${workspace}/dataset/bbc-news/TG_GPT2_tokenizer.json
  truncate_direction: right

save_folder: workspace/${run_name}
save_overwrite: true
save_interval_unsharded: null
save_num_unsharded_checkpoints_to_keep: -1
load_path: null

max_duration: 1ep
stop_at: 20
global_train_batch_size: 16
device_train_microbatch_size: 4

precision: amp_bf16
distributed_strategy: ddp

gen1_gc_interval: 1
max_grad_norm: 1.0
max_grad_norm_ratio: null

speed_monitor:
  window_size: 20

eval_interval: 1000000
eval_subset_num_batches: -1
device_eval_batch_size: ${device_train_microbatch_size}
evaluators: []

data:
  pad_direction: right
  generate_attention_mask: true
  num_workers: 2
  drop_last: true
  pin_memory: true
  prefetch_factor: 2
  persistent_workers: false
  timeout: 0
  paths:
    - ${workspace}/dataset/bbc-news/parse_aligned/test_left
  parse_tree_paths:
    - ${workspace}/dataset/bbc-news/tree/test.npy
