run_name: OLMo-300M-pushdown-profile
seed: 6198
dry_run: false
epoch: null
wandb: null

model:
  d_model: 768
  n_heads: 12
  n_layers: 12
  mlp_ratio: 4
  mlp_hidden_size: 3072
  weight_tying: true
  alibi: false
  rope: true
  flash_attention: true
  flex_attention: true
  attention_dropout: 0.0
  attention_layer_norm: false
  clip_qkv: null
  include_bias: true
  block_type: sequential
  layer_norm_type: rms
  layer_norm_with_affine: true
  layer_norm_eps: 1e-6
  bias_for_layer_norm: true
  attention_layer_norm_with_affine: false
  activation_type: swiglu
  residual_dropout: 0.0
  embedding_dropout: 0.0
  max_sequence_length: 2048
  vocab_size: 50320
  embedding_size: 50320
  bos_token_id: 50260
  eos_token_id: 50256
  pad_token_id: 50258
  init_device: cuda
  init_fn: normal
  init_std: 0.02
  init_cutoff_factor: 3
  transformer_grammar_type: pushdown
  pushdown_max_depth: 64
  pushdown_attachment_weight: 1.0
  pushdown_use_attachment_head_inference: true
  parse_binarize_direction: right
  pushdown_use_flex: true

ddp:
  grad_sync_mode: batch
  find_unused_params: false

optimizer:
  name: adamw
  learning_rate: 0.005323
  weight_decay: 0.1
  eps: 1e-8
  betas: [0.9, 0.95]
  metrics_log_interval: null

scheduler:
  name: cosine_with_warmup
  t_warmup: 2000
  min_lr: 1e-5
  warmup_min_lr: 0

tokenizer:
  identifier: ${workspace}/dataset/bbc-news/TG_GPT2_tokenizer.json
  vocabulary: ${workspace}/dataset/bbc-news/TG_GPT2_tokenizer.json
  truncate_direction: right

save_folder: artifacts/experiment/pushdown-gpu-opt-20260802/runtime/default
save_overwrite: true
save_interval: null
save_interval_unsharded: null
save_num_checkpoints_to_keep: 0
save_num_unsharded_checkpoints_to_keep: 0
no_pre_train_checkpoint: true
eval_no_save: true
save_data_indices: false

max_duration: 1ep
stop_at: 22
global_train_batch_size: 32
device_train_microbatch_size: 4

precision: amp_bf16
distributed_strategy: ddp
gen1_gc_interval: 1
max_grad_norm: 1.0
max_grad_norm_ratio: null
console_log_interval: 1

speed_monitor:
  window_size: 20

eval_interval: 1000000
eval_subset_num_batches: -1
device_eval_batch_size: 4
evaluators: []

data:
  pad_direction: right
  generate_attention_mask: true
  generate_doc_lengths: true
  num_workers: 0
  drop_last: true
  pin_memory: true
  prefetch_factor: null
  persistent_workers: false
  timeout: 0
  paths:
    - ${workspace}/dataset/bbc-news/parse_aligned/train_pushdown_unary
  parse_tree_paths:
    - ${workspace}/dataset/bbc-news/tree/train.npy
