# A800 1B tree / tgtree models — 11-task OLMES bootstrap evaluation.
# Terminal-format scoring (tree_eval_type: terminal) per paper Table 6 / Eq.5:
# only terminal-token log-probs contribute to the MC score (NT tokens would
# otherwise dominate). For tree models this reproduces the paper's reported
# "Treeterm" / "TGTreeterm" numbers.
#
# Driver overrides --model.transformer_grammar_type (tree|tgtree) and --load_path.
run_name: a800_bootstrap_tree
seed: 6198
dry_run: false
eval_on_load: true
eval_no_save: true
max_duration: 0
stop_at: 0
# Eval-only: skip optimizer/trainer state restore (checkpoints saved under a
# different FSDP param-group structure; model weights load fine without it).
reset_optimizer_state: true
reset_trainer_state: true

wandb:
  name: ${run_name}
  project: TG-bbcnews
  entity: qlwpc-shanghaitech-university
  mode: disabled

model:
  d_model: 2048
  n_heads: 16
  n_layers: 16
  mlp_ratio: 8
  activation_type: swiglu
  block_type: sequential
  alibi: false
  rope: true
  rope_full_precision: true
  rope_theta: 500000
  flash_attention: true
  flex_attention: false
  attention_dropout: 0.0
  residual_dropout: 0.0
  embedding_dropout: 0.0
  layer_norm_type: rms
  layer_norm_with_affine: true
  layer_norm_eps: 1.0e-6
  bias_for_layer_norm: true
  attention_layer_norm_with_affine: false
  max_sequence_length: 2048
  include_bias: false
  weight_tying: true
  eos_token_id: 151643
  pad_token_id: 151670
  vocab_size: 151732
  embedding_size: 151732
  init_device: cuda
  init_fn: normal
  init_std: 0.02
  init_cutoff_factor: 3.0
  transformer_grammar_type: tree   # overridden by driver: tree | tgtree

optimizer:
  name: adamw
  learning_rate: 6.0e-4
  weight_decay: 0.1
  eps: 1.0e-8
  betas: [0.9, 0.95]

scheduler:
  name: cosine_with_warmup
  t_warmup: 2000
  alpha_f: 0.1
  warmup_min_lr: 0.0

tokenizer:
  identifier: ${workspace}/dataset/TG_QWEN3_tokenizer.json
  vocabulary: ${workspace}/dataset/TG_QWEN3_tokenizer.json
  truncate_direction: right

save_folder: ${workspace}/analysis-output/bootstrap/tree
save_overwrite: true
load_path: ${workspace}/saved_models/A800_models/tree_1B/step137217-unsharded

global_train_batch_size: 512
device_train_microbatch_size: 4
device_eval_batch_size: 4

precision: amp_bf16
distributed_strategy: fsdp

eval_interval: 1000000
eval_subset_num_batches: -1

# 11-task OLMES suite, terminal-format scoring (paper Eq.5).
evaluators:
  - {label: winogrande,    type: downstream, tree_eval_type: terminal}
  - {label: hellaswag,     type: downstream, tree_eval_type: terminal}
  - {label: boolq,         type: downstream, tree_eval_type: terminal}
  - {label: piqa,          type: downstream, tree_eval_type: terminal}
  - {label: arc_easy,      type: downstream, tree_eval_type: terminal}
  - {label: arc_challenge, type: downstream, tree_eval_type: terminal}
  - {label: openbook_qa,    type: downstream, tree_eval_type: terminal}
  - {label: commonsense_qa, type: downstream, tree_eval_type: terminal}
  - {label: social_iqa,    type: downstream, tree_eval_type: terminal}
  - {label: mmlu,          type: downstream, tree_eval_type: terminal}
  - {label: mmluredux,     type: downstream, tree_eval_type: terminal}

data:
  pad_direction: right
  num_workers: 4
  drop_last: true
  pin_memory: true
  prefetch_factor: 8
  persistent_workers: true
  timeout: 0
  paths:
    - ${workspace}/dataset/hellaswag/hellaswag_val.txt
