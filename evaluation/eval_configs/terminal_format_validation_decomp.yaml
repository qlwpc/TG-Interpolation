# Validation-8 full-vs-terminal decomposition for FineWeb-Edu 1B Tree models.
run_name: terminal_format_validation_tree
seed: 6198
dry_run: false
eval_on_load: true
eval_no_save: true
max_duration: 0
stop_at: 0
reset_optimizer_state: true
reset_trainer_state: true

wandb:
  name: ${run_name}
  project: TG-bbcnews
  entity: qlwpc-shanghaitech-university
  mode: disabled

model:
  d_model: 2048
  n_heads: 16
  n_layers: 16
  mlp_ratio: 8
  activation_type: swiglu
  block_type: sequential
  alibi: false
  rope: true
  rope_full_precision: true
  rope_theta: 500000
  flash_attention: true
  flex_attention: false
  attention_dropout: 0.0
  residual_dropout: 0.0
  embedding_dropout: 0.0
  layer_norm_type: rms
  layer_norm_with_affine: true
  layer_norm_eps: 1.0e-6
  bias_for_layer_norm: true
  attention_layer_norm_with_affine: false
  max_sequence_length: 2048
  include_bias: false
  weight_tying: true
  eos_token_id: 151643
  pad_token_id: 151670
  vocab_size: 151732
  embedding_size: 151732
  init_device: cuda
  init_fn: normal
  init_std: 0.02
  init_cutoff_factor: 3.0
  transformer_grammar_type: tree

optimizer:
  name: adamw
  learning_rate: 6.0e-4
  weight_decay: 0.1
  eps: 1.0e-8
  betas: [0.9, 0.95]

scheduler:
  name: cosine_with_warmup
  t_warmup: 2000
  alpha_f: 0.1
  warmup_min_lr: 0.0

tokenizer:
  identifier: ${workspace}/dataset/TG_QWEN3_tokenizer.json
  vocabulary: ${workspace}/dataset/TG_QWEN3_tokenizer.json
  truncate_direction: right

save_folder: ${workspace}/artifacts/experiment/terminal-format-validation-20260828/runs/tree_decomp
save_overwrite: true
load_path: ${workspace}/saved_models/A800_models/tree_1B/step137217-unsharded

global_train_batch_size: 512
device_train_microbatch_size: 1
device_eval_batch_size: 4
precision: amp_bf16
distributed_strategy: fsdp
eval_interval: 1000000
eval_subset_num_batches: -1

evaluators:
  - {label: winogrande_decomp, type: downstream}
  - {label: hellaswag_decomp, type: downstream}
  - {label: piqa_decomp, type: downstream}
  - {label: arc_easy_decomp, type: downstream}
  - {label: arc_challenge_decomp, type: downstream}
  - {label: openbook_qa_validation_decomp, type: downstream}
  - {label: commonsense_qa_decomp, type: downstream}
  - {label: social_iqa_decomp, type: downstream}

data:
  pad_direction: right
  num_workers: 0
  drop_last: false
  pin_memory: false
  persistent_workers: false
  paths:
    - ${workspace}/dataset/hellaswag/hellaswag_val.txt
