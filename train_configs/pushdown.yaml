run_name: OLMo-300M-pushdown
seed: 6198
dry_run: false
epoch: null

wandb:
  name: ${run_name}
  project: TG-bbcnews
  entity: qlwpc-shanghaitech-university

model:
  d_model: 768
  n_heads: 12
  n_layers: 12
  mlp_ratio: 4
  mlp_hidden_size: 3072
  weight_tying: true
  alibi: false
  rope: true
  flash_attention: true      # used for the no-parse (eval) path; Pushdown bias path uses SDPA
  flex_attention: true       # compiles flex_attention; the Pushdown score_mod fast path needs this
  attention_dropout: 0.0
  attention_layer_norm: false
  clip_qkv: null
  include_bias: true
  block_type: sequential
  layer_norm_type: rms
  layer_norm_with_affine: true
  layer_norm_eps: 1e-6
  bias_for_layer_norm: true
  attention_layer_norm_with_affine: false
  activation_type: swiglu
  residual_dropout: 0.0
  embedding_dropout: 0.0
  max_sequence_length: 2048
  vocab_size: 50320
  embedding_size: 50320
  eos_token_id: 50256
  pad_token_id: 50258
  init_device: cuda
  init_fn: normal
  init_std: 0.02
  init_cutoff_factor: 3
  transformer_grammar_type: pushdown
  pushdown_max_depth: 64
  pushdown_attachment_weight: 1.0   # depth-key bias only (attachment head optional)
  parse_binarize_direction: left
  # FlexAttention score_mod path (fused flash-class kernel for the per-(q,kv) depth
  # bias). ON — the recommended training path. OLMo.forward builds a causal+pad
  # block_mask from the 1-D attention_mask (mirroring the TG path) and the depth
  # bias goes into the score_mod: no (B, n_h, n, n) fp32 mask, no math-backend SDPA
  # (the SDPA path is ~100x slower and OOMs at microbatch 12). Requires
  # flex_attention: true above. flex_attention is compiled independently of
  # block.compile(), so this works even though compute_depth_matrix_gpu's index_put_
  # graph-breaks block.compile (it runs eagerly outside the score_mod closure).
  #
  # Bias representation. DEFAULT = fix #2: the score_mod gathers P[b,h,q, Dc[b,q,kv]]
  # INSIDE the flex kernel with P DETACHED (captured buffer = ~77 MB P, not a 2.4 GB
  # dense db), and a custom autograd Function (_DepthBiasGradP) computes grad_P
  # manually (recompute pT + fp32 scatter_add into 77 MB P). This is 2.9x faster than
  # the old dense-db path (14.24s vs 41.5s/step single-GPU), grad reaches depth_emb
  # (no find_unused_params needed), and scales down with world_size. See memory
  # pushdown-flex-slowdown-analysis.
  #
  # OLMO_PUSHDOWN_DENSE_DB=1: fall back to the old slow path (pre-materialize
  # db=take_along_dim(P,Dc) ~2.4 GB/layer; backward zeros_and_scatters into it).
  # Debugging/parity only.
  pushdown_use_flex: true

ddp:
  grad_sync_mode: batch
  find_unused_params: false

# compile: REMOVED — `cfg.compile is not None` always triggers block.compile() (even
# mode=null), and torch.compile graph-breaks on index_put_ in compute_depth_matrix_gpu,
# crashing pushdown attention. Leave unset (= None) to skip torch.compile.

optimizer:
  name: adamw
  learning_rate: 0.005323
  weight_decay: 0.1
  eps: 1e-8
  betas:
  - 0.9
  - 0.95
  metrics_log_interval: 10

scheduler:
  name: cosine_with_warmup
  t_warmup: 2000
  min_lr: 1e-5
  warmup_min_lr: 0

tokenizer:
  identifier: ${workspace}/dataset/bbc-news/TG_GPT2_tokenizer.json
  vocabulary: ${workspace}/dataset/bbc-news/TG_GPT2_tokenizer.json
  truncate_direction: right

save_folder: workspace/${run_name}
save_overwrite: true
save_interval_unsharded: 5000
save_num_unsharded_checkpoints_to_keep: 1
load_path: null

max_duration: 1ep
stop_at: 1442500
global_train_batch_size: 144
device_train_microbatch_size: 12    # flex path peak is small (int8 S ~50MB + P ~77MB/layer);
                                    # 12 is conservative — sweep 24/32 on GPU after the parity test passes

precision: amp_bf16
distributed_strategy: ddp

gen1_gc_interval: 1
max_grad_norm: 1.0
max_grad_norm_ratio: null

speed_monitor:
  window_size: 20

eval_interval: 1000
eval_subset_num_batches: -1
device_eval_batch_size: ${device_train_microbatch_size}
evaluators:
  - label: TG-ppl-validation
    data:
      num_workers: 0
      pin_memory: true
      drop_last: false
      generate_doc_lengths: true
      generate_attention_mask: true
      paths:
        - ${workspace}/dataset/bbc-news/parse_aligned/dev_pushdown
      parse_tree_paths:
        - ${workspace}/dataset/bbc-news/tree/dev.npy
  - label: TG-ppl-validation-test
    data:
      num_workers: 0
      pin_memory: true
      drop_last: false
      generate_doc_lengths: true
      generate_attention_mask: true
      paths:
        - ${workspace}/dataset/bbc-news/parse_aligned/test_pushdown
      parse_tree_paths:
        - ${workspace}/dataset/bbc-news/tree/test.npy

data:
  pad_direction: right
  generate_attention_mask: true
  num_workers: 0
  drop_last: true
  pin_memory: true
  prefetch_factor: 2    # was 8 — halves in-flight page faults across the 189GB
                       # input_ids+spans mmaps (cgroup page-cache OOM guard)
  persistent_workers: true
  timeout: 0
  paths:
    - ${workspace}/dataset/bbc-news/parse_aligned/train_pushdown
  parse_tree_paths:
    - ${workspace}/dataset/bbc-news/tree/train.npy
