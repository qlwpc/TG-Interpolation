# Profiling config for the pushdown NO_BIAS A/B probe. Identical to pushdown.yaml
# (flex on, microbatch 12, prod shapes) EXCEPT:
#   - stop_at: 8            (just enough to see steady-state step time)
#   - find_unused_params: true + grad_sync_mode: micro_batch
#       REQUIRED for OLMO_PUSHDOWN_NO_BIAS=1: dropping the depth bias leaves the
#       12 per-layer depth_emb Embeddings with no grad; DDP crashes "unused
#       parameters" unless find_unused_params is true (and grad_sync_mode must be
#       micro_batch when find_unused_params is set — see olmo/config.py:885).
#   - no eval, no wandb (eval_interval huge, evaluators empty).
#
# Run with:
#   OLMO_STEP_PROFILE=1 OLMO_PUSHDOWN_NO_BIAS=1 \
#     /home/scyb223/.conda/envs/LLMH100/bin/python -m torch.distributed.run ... \
#     scripts/train.py train_configs/pushdown_profile.yaml
#
# Interpretation:
#   - NO_BIAS ~1-2 s/step  -> the ~41s/step is the bias ops (forward take_along_dim
#     materializing 2.4GB/layer fp32 + backward zeros_and_scatter into it). Confirms
#     fix #2 (detach P + aux loss) is the right target.
#   - NO_BIAS still ~40s/step -> the cost is flex_attention itself or block_mask
#     construction, NOT the bias. Rethink.

run_name: OLMo-300M-pushdown-profile-nobias
seed: 6198
dry_run: false
epoch: null

wandb:
  name: ${run_name}
  project: TG-bbcnews
  entity: qlwpc-shanghaitech-university
  mode: disabled

model:
  d_model: 768
  n_heads: 12
  n_layers: 12
  mlp_ratio: 4
  mlp_hidden_size: 3072
  weight_tying: true
  alibi: false
  rope: true
  flash_attention: true
  flex_attention: true
  attention_dropout: 0.0
  attention_layer_norm: false
  clip_qkv: null
  include_bias: true
  block_type: sequential
  layer_norm_type: rms
  layer_norm_with_affine: true
  layer_norm_eps: 1e-6
  bias_for_layer_norm: true
  attention_layer_norm_with_affine: false
  activation_type: swiglu
  residual_dropout: 0.0
  embedding_dropout: 0.0
  max_sequence_length: 2048
  vocab_size: 50320
  embedding_size: 50320
  eos_token_id: 50256
  pad_token_id: 50258
  init_device: cuda
  init_fn: normal
  init_std: 0.02
  init_cutoff_factor: 3
  transformer_grammar_type: pushdown
  pushdown_max_depth: 64
  pushdown_attachment_weight: 0.0
  parse_binarize_direction: right
  pushdown_use_flex: true

ddp:
  grad_sync_mode: micro_batch        # REQUIRED with find_unused_params (config.py:885)
  find_unused_params: true           # REQUIRED for NO_BIAS (depth_emb gets no grad)

# compile: REMOVED (index_put_ in compute_depth_matrix_gpu graph-breaks torch.compile)

optimizer:
  name: adamw
  learning_rate: 0.005323
  weight_decay: 0.1
  eps: 1e-8
  betas:
  - 0.9
  - 0.95
  metrics_log_interval: 10

scheduler:
  name: cosine_with_warmup
  t_warmup: 2000
  min_lr: 1e-5
  warmup_min_lr: 0

tokenizer:
  identifier: ${workspace}/dataset/bbc-news/TG_GPT2_tokenizer.json
  vocabulary: ${workspace}/dataset/bbc-news/TG_GPT2_tokenizer.json
  truncate_direction: right

save_folder: workspace/${run_name}
save_overwrite: true
save_interval_unsharded: null
save_num_unsharded_checkpoints_to_keep: -1
load_path: null

max_duration: 1ep
stop_at: 8
global_train_batch_size: 144
device_train_microbatch_size: 12

precision: amp_bf16
distributed_strategy: ddp

gen1_gc_interval: 1
max_grad_norm: 1.0
max_grad_norm_ratio: null

speed_monitor:
  window_size: 20

eval_interval: 1000000
eval_subset_num_batches: -1
device_eval_batch_size: ${device_train_microbatch_size}
evaluators: []

data:
  pad_direction: right
  generate_attention_mask: true
  num_workers: 4
  drop_last: true
  pin_memory: true
  prefetch_factor: 4
  persistent_workers: true
  timeout: 0
  paths:
    - ${workspace}/dataset/bbc-news/parse_aligned/train_right
  parse_tree_paths:
    - ${workspace}/dataset/bbc-news/tree/train.npy
