run_name: OLMo-300M
seed: 6198
dry_run: false
epoch: null

wandb:
  name: ${run_name}
  project: TG-bbcnews
  entity: qlwpc-shanghaitech-university

model:
  d_model: 768
  n_heads: 12
  n_layers: 12
  mlp_ratio: 4
  mlp_hidden_size: 3072
  weight_tying: true
  alibi: false
  rope: true
  flash_attention: true
  attention_dropout: 0.0
  attention_layer_norm: false
  clip_qkv: null
  include_bias: true
  block_type: sequential
  layer_norm_type: rms
  layer_norm_with_affine: true
  layer_norm_eps: 1e-6
  bias_for_layer_norm: true
  attention_layer_norm_with_affine: false
  activation_type: swiglu
  residual_dropout: 0.0
  embedding_dropout: 0.0
  max_sequence_length: 2048
  vocab_size: 50320
  embedding_size : 50320
  eos_token_id: 50256
  pad_token_id: 50258
  init_device: cuda
  init_fn: normal
  init_std: 0.02
  init_cutoff_factor: 3
  transformer_grammar_type : tree

ddp:
  grad_sync_mode: batch
  find_unused_params: false

compile: null

optimizer:
  name: adamw
  learning_rate: 3.0e-4
  weight_decay: 0.1
  eps: 1e-8
  betas:
  - 0.9
  - 0.95
  metrics_log_interval: 10

scheduler:
  name: cosine_with_warmup
  t_warmup: 100
  min_lr: 1e-6
  warmup_min_lr: 0

tokenizer:
  identifier: ${workspace}/dataset/bbc-news/TG_GPT2_tokenizer.json 
  vocabulary: ${workspace}/dataset/bbc-news/TG_GPT2_tokenizer.json 
  truncate_direction: right

save_folder: workspace/${run_name}  # doesn't matter since we'll upload to S3
#remote_save_folder: s3://ai2-llm/checkpoints/olmo-tiny/${run_name}
save_overwrite: true

# Unsharded checkpoints (for ddp)
save_interval_unsharded: 3000
save_num_unsharded_checkpoints_to_keep: -1

load_path: null

max_duration: 5ep
stop_at: 10000
global_train_batch_size: 40
device_train_microbatch_size: 10

precision: amp_bf16
distributed_strategy: ddp

gen1_gc_interval: 1

max_grad_norm: 1.0
max_grad_norm_ratio: null

speed_monitor:
  window_size: 20 

eval_interval: 50000
eval_subset_num_batches: -1
device_eval_batch_size: ${device_train_microbatch_size}
reset_optimizer_state: true
reset_trainer_state: true
finetune_task: boolq
evaluators:
  - label: boolq
    type: downstream
data:
  pad_direction: right
  num_workers: 1
  drop_last: true
  pin_memory: true
  prefetch_factor: 8
  persistent_workers: true
  timeout: 0
  paths: 
    - /home/wangpch/TG-Interpolation/dataset/bbc-news/tg/dev.npy