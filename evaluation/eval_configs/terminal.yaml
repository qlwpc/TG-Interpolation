run_name: OLMo-300M
seed: 6198
dry_run: false
epoch: null

wandb:
  name: ${run_name}
  project: TG-bbcnews
  entity: qlwpc-shanghaitech-university

model:
  d_model: 768
  n_heads: 12
  n_layers: 12
  mlp_ratio: 4
  mlp_hidden_size: 3072
  weight_tying: true
  alibi: false
  rope: true
  flash_attention: true   
  attention_dropout: 0.0
  attention_layer_norm: false
  clip_qkv: null
  include_bias: true
  block_type: sequential
  layer_norm_type: rms
  layer_norm_with_affine: true
  layer_norm_eps: 1e-6
  bias_for_layer_norm: true
  attention_layer_norm_with_affine: false
  activation_type: swiglu
  residual_dropout: 0.0
  embedding_dropout: 0.0
  max_sequence_length: 2048
  vocab_size: 50320
  embedding_size : 50320
  eos_token_id: 50256
  pad_token_id: 50258
  init_device: cuda
  init_fn: normal
  init_std: 0.02
  init_cutoff_factor: 3

ddp:
  grad_sync_mode: batch
  find_unused_params: false

compile: null

optimizer:
  name: adamw
  learning_rate: 6.0e-4
  weight_decay: 0.1
  eps: 1e-8
  betas:
  - 0.9
  - 0.95
  metrics_log_interval: 10

scheduler:
  name: cosine_with_warmup
  t_warmup: 2000
  alpha_f: 0.1
  warmup_min_lr: 0

tokenizer:
  identifier: /dev/shm/dataset/bbc-news/TG_GPT2_tokenizer.json 
  vocabulary: /dev/shm/dataset/bbc-news/TG_GPT2_tokenizer.json 
  truncate_direction: right

save_folder: workspace/${run_name}  # doesn't matter since we'll upload to S3
#remote_save_folder: s3://ai2-llm/checkpoints/olmo-tiny/${run_name}
save_overwrite: true

# Unsharded checkpoints (for ddp)
save_interval_unsharded: 3000
save_num_unsharded_checkpoints_to_keep: -1

load_path: null

max_duration: 2ep
stop_at: 800000
global_train_batch_size: 128
device_train_microbatch_size: 6

precision: amp_bf16
distributed_strategy: ddp

gen1_gc_interval: 1

max_grad_norm: 1.0
max_grad_norm_ratio: null

speed_monitor:
  window_size: 20 

eval_interval: 50
eval_subset_num_batches: -1
eval_on_load: true
eval_no_save: true
device_eval_batch_size: ${device_train_microbatch_size}
evaluators:
  - label: TG-ppl-validation-5000
    data:
      num_workers: 1
      pin_memory: true
      drop_last: false
      paths:
        - /dev/shm/dataset/bbc-news/terminal/test_5000.npy
  - label: TG-ppl-validation-8000
    data:
      num_workers: 1
      pin_memory: true
      drop_last: false
      paths:
        - /dev/shm/dataset/bbc-news/terminal/test_8000.npy
  - label: TG-ppl-validation-10000
    data:
      num_workers: 1
      pin_memory: true
      drop_last: false
      paths:
        - /dev/shm/dataset/bbc-news/terminal/test_10000.npy
  - label: TG-ppl-validation-20000
    data:
      num_workers: 1
      pin_memory: true
      drop_last: false
      paths:
        - /dev/shm/dataset/bbc-news/terminal/test_20000.npy
  - label: TG-ppl-validation-40000
    data:
      num_workers: 1
      pin_memory: true
      drop_last: false
      paths:
        - /dev/shm/dataset/bbc-news/terminal/test_40000.npy
  - label: TG-ppl-validation-100000
    data:
      num_workers: 1
      pin_memory: true
      drop_last: false
      paths:
        - /dev/shm/dataset/bbc-news/terminal/test_100000.npy
  - label: syntactic_generalization
    type: downstream

data:
  pad_direction: right
  num_workers: 1
  drop_last: true
  pin_memory: true
  prefetch_factor: 8
  persistent_workers: true
  timeout: 0
  paths: 
    - /dev/shm/dataset/bbc-news/terminal/CC-MAIN-2013-20.npy