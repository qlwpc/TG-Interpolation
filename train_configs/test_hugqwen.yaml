run_name: OLMo2-1B-stage1
seed: 6198
dry_run: false

wandb:
  name: ${run_name}
  project: TG-finewebedu
  entity: qlwpc-shanghaitech-university

model:
  d_model: 2048
  n_heads: 16
  n_layers: 16
  mlp_ratio: 8
  weight_tying: true
  alibi: false
  rope: true
  rope_theta: 500000
  flash_attention: false
  attention_dropout: 0.0
  include_bias: false
  block_type: sequential
  layer_norm_type: rms
  layer_norm_with_affine: true
  layer_norm_eps: 1e-6
  bias_for_layer_norm: true
  attention_layer_norm: false
  attention_layer_norm_with_affine: false
  norm_after: false
  activation_type: swiglu
  residual_dropout: 0.0
  embedding_dropout: 0.0
  max_sequence_length: 2048
  vocab_size: 151732
  embedding_size: 151732
  eos_token_id: 151643
  pad_token_id: 151670
  init_device: cuda
  init_fn: normal
  init_std: 0.02
  init_cutoff_factor: 3
  modelname: Qwen/Qwen3-0.6B-base

# softmax_auxiliary_loss: true
# auxiliary_loss_multiplier: 1e-5
# fused_loss: true

compile: null

optimizer:
  name: adamw
  learning_rate: 0.001536
  weight_decay: 0.1
  eps: 1e-8
  decay_norm_and_bias: true
  decay_embeddings: false
  betas:
  - 0.9
  - 0.95
  metrics_log_interval: 10

scheduler:
  name: cosine_with_warmup
  t_warmup: 2000
  min_lr: 1e-5
  warmup_min_lr: 0.0

tokenizer:
  identifier: ${workspace}/TG-Interpolation/dataset/TG_QWEN3_tokenizer.json
  vocabulary: ${workspace}/TG-Interpolation/dataset/TG_QWEN3_tokenizer.json
  truncate_direction: right

save_folder: workspace/${run_name}
save_overwrite: true

save_interval: 10000
save_num_checkpoints_to_keep: 0
# sharded_checkpointer: olmo_core

save_interval_unsharded: 10000
save_num_unsharded_checkpoints_to_keep: -1

load_path: null

max_duration: 0ep
global_train_batch_size: 512
device_train_microbatch_size: 8

precision: amp_bf16
distributed_strategy: ddp

fsdp:
  wrapping_strategy: by_block
  sharding_strategy: FULL_SHARD
  precision: pure

ddp:
  grad_sync_mode: batch
  find_unused_params: false

max_grad_norm: 1.0
max_grad_norm_ratio: null

speed_monitor:
  window_size: 1

gen1_gc_interval: 10

eval_interval: 1000
eval_subset_num_batches: -1
eval_on_load: true
eval_no_save: true
eval_return: true
device_eval_batch_size: ${device_train_microbatch_size}
evaluators:
    # - label: hellaswag
    #   type: downstream
    # - label: winogrande
    #   type: downstream
    - label: boolq
      type: downstream
    # - label: mmluredux
    #   type: downstream
    # - label: mmlu
    #   type: downstream
    # - label: mmlu_term
    #   type: downstream

data:
  pad_direction: right
  # generate_doc_lengths: true
  memmap_dtype: uint32
  num_workers: 4
  drop_last: true
  pin_memory: true
  prefetch_factor: 8
  persistent_workers: true
  timeout: 0
  paths:
    - ${workspace}/TG-Interpolation/dataset/hellaswag/hellaswag_val.txt
