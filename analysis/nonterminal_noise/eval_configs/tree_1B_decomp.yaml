# Eval config for Tree-1B (GPT-2 tokenizer) decomposed MC evaluation
# Usage:
#   torchrun --nproc-per-node=8 scripts/train.py analysis/nonterminal_noise/eval_configs/tree_1B_decomp.yaml \
#       --load_path=saved_models/Tree_1B/step49440-unsharded \
#       --run_name=tree-1B-decomp \
#       --save_folder=/tmp/tree-1B-decomp --save_overwrite

run_name: tree-1B-decomp
seed: 6198
dry_run: false

wandb:
  name: ${run_name}
  project: TG-eval
  entity: qlwpc-shanghaitech-university

model:
  d_model: 2048
  n_heads: 16
  n_layers: 16
  mlp_ratio: 8
  weight_tying: true
  alibi: false
  rope: true
  rope_theta: 500000
  flash_attention: true
  attention_dropout: 0.0
  include_bias: false
  block_type: sequential
  layer_norm_type: rms
  layer_norm_with_affine: true
  layer_norm_eps: 1e-6
  bias_for_layer_norm: true
  attention_layer_norm: false
  attention_layer_norm_with_affine: false
  norm_after: false
  activation_type: swiglu
  residual_dropout: 0.0
  embedding_dropout: 0.0
  max_sequence_length: 2048
  vocab_size: 50320
  embedding_size: 50320
  eos_token_id: 50256
  pad_token_id: 50258
  init_device: cuda
  init_fn: normal
  init_std: 0.02
  init_cutoff_factor: 3
  transformer_grammar_type: tree

compile: null

optimizer:
  name: adamw
  learning_rate: 0.0026614
  weight_decay: 0.1
  eps: 1e-8
  decay_norm_and_bias: true
  decay_embeddings: false
  betas:
  - 0.9
  - 0.95
  metrics_log_interval: 10

scheduler:
  name: constant_with_warmup
  t_warmup: 2000
  min_lr: 1e-5
  warmup_min_lr: 0.0

tokenizer:
  identifier: ${workspace}/dataset/bbc-news/TG_GPT2_tokenizer.json
  vocabulary: ${workspace}/dataset/bbc-news/TG_GPT2_tokenizer.json
  truncate_direction: right
  use_bracket_mapping: true

save_folder: /tmp/${run_name}
save_overwrite: true

save_interval: 10000
save_num_checkpoints_to_keep: 0

save_interval_unsharded: 10000
save_num_unsharded_checkpoints_to_keep: -1

load_path: null

max_duration: 0
global_train_batch_size: 832
device_train_microbatch_size: 5

precision: amp_bf16
distributed_strategy: ddp

fsdp:
  wrapping_strategy: by_block
  sharding_strategy: FULL_SHARD
  precision: pure

ddp:
  grad_sync_mode: batch
  find_unused_params: false

max_grad_norm: 1.0
max_grad_norm_ratio: null

speed_monitor:
  window_size: 1

gen1_gc_interval: 10

eval_on_load: true
eval_no_save: true
eval_interval: 1000000
eval_subset_num_batches: -1
device_eval_batch_size: ${device_train_microbatch_size}
evaluators:
  - label: hellaswag
    type: downstream
  - label: hellaswag_term
    type: downstream
  - label: hellaswag_decomp
    type: downstream
  - label: winogrande
    type: downstream
  - label: winogrande_term
    type: downstream
  - label: winogrande_decomp
    type: downstream
  - label: arc_easy
    type: downstream
  - label: arc_easy_term
    type: downstream
  - label: arc_easy_decomp
    type: downstream
  - label: arc_challenge
    type: downstream
  - label: arc_challenge_term
    type: downstream
  - label: arc_challenge_decomp
    type: downstream
  - label: piqa
    type: downstream
  - label: piqa_term
    type: downstream
  - label: piqa_decomp
    type: downstream
  - label: social_iqa
    type: downstream
  - label: social_iqa_term
    type: downstream
  - label: social_iqa_decomp
    type: downstream
  - label: commonsense_qa
    type: downstream
  - label: commonsense_qa_term
    type: downstream
  - label: commonsense_qa_decomp
    type: downstream
  - label: openbook_qa
    type: downstream
  - label: openbook_qa_term
    type: downstream
  - label: openbook_qa_decomp
    type: downstream

data:
  pad_direction: right
  num_workers: 6
  drop_last: true
  memmap_dtype: uint32
  pin_memory: true
  prefetch_factor: 8
  persistent_workers: true
  timeout: 0
  paths:
    - ${workspace}/dataset/fineweb-edu-v2/tree/*-000000*arrow.npy
    - ${workspace}/dataset/fineweb-edu-v2/tree/*-000001*arrow.npy
