name: Source checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Check public files, links, frozen inputs and syntax
        run: python scripts/check_public_release.py --syntax
      - name: Check generated results
        run: python scripts/render_dedup_results.py --check
      - name: Verify exported public copy
        run: |
          python scripts/check_public_release.py --export "$RUNNER_TEMP/tg-public"
          cd "$RUNNER_TEMP/tg-public"
          python scripts/check_public_release.py --syntax
          python scripts/render_dedup_results.py --check
